# Alertmanager for the SSH detection stack. Lab scope: alerts are kept and shown in the
# Alertmanager and Grafana UIs; no external notification channel is configured.
route:
  receiver: lab-ui-only
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: lab-ui-only
