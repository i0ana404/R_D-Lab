title: SSH Successful Root Login With Password
id: 9ec7cb5c-69dd-44fd-8f36-bf1ea10e3ff2
status: experimental
description: |
    Detects a successful SSH login as root that authenticated with a password.
    On a correctly configured host root may only log in with a key, so a password
    success for root means either sshd is misconfigured or the root password was
    guessed or stolen. Matches the ECS events produced by
    logstash/pipeline/20-filter-sshd.conf.
references:
    - https://attack.mitre.org/techniques/T1078/003/
author: i0ana404
date: 2026-11-16
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.initial-access
    - attack.t1078.003
logsource:
    product: linux
    service: sshd
detection:
    selection_root_password_success:
        event.category: authentication
        event.outcome: success
        user.name: root
        system.auth.ssh.method: password
    condition: selection_root_password_success
falsepositives:
    - Hosts where root password login is intentionally allowed (e.g. a lab or rescue setup) and an administrator uses it
    - Break-glass access by an administrator during an outage when key login is unavailable
# High: a root password success is either a policy violation or a compromised root account, and is rare enough to review every time.
level: high
