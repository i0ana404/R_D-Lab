# Single-node OpenSearch 2.19.1 + OpenSearch Dashboards 2.19.1 (R-02).
# Start with `make up`: it passes .env (ports) and .env.secrets (decrypted at deploy time) to compose.
# Host ports come from .env; defaults are documented in .env.example. Ports bind to 127.0.0.1 only.
# Images are pinned by tag and digest; digests recorded on the deploy host on 2026-11-03 with docker pull + docker inspect.

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1@sha256:72fe2fc84be8295906b8efca020b46c58ed45c8da60cd9b8b49e1991e38e89a4
    container_name: opensearch
    environment:
      discovery.type: single-node
      # Value comes from the environment at deploy time (.env.secrets via `make up`); never set it here.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?OPENSEARCH_INITIAL_ADMIN_PASSWORD is not set; run make up}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT}:9200"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1@sha256:70fb0a6563f204f391c444329287ce7ac50dbb7b99a43307c047de1fcfb9c658
    container_name: opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    ports:
      - "127.0.0.1:${DASHBOARDS_PORT}:5601"
    depends_on:
      - opensearch

  frontdoor:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: frontdoor
    volumes:
      - ./nginx/frontdoor.conf:/etc/nginx/conf.d/default.conf:ro
      # certs/ is git-ignored; the certificate and key are issued by the lab CA (step-ca) on the deploy host.
      - ./certs/frontdoor.crt:/etc/nginx/certs/frontdoor.crt:ro
      - ./certs/frontdoor.key:/etc/nginx/certs/frontdoor.key:ro
    ports:
      - "127.0.0.1:${HTTPS_PORT}:443"
    depends_on:
      - opensearch-dashboards

volumes:
  opensearch-data:
