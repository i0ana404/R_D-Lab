# Send parsed sshd events to OpenSearch, one index per day (R-03).
# The password is read from the OPENSEARCH_INITIAL_ADMIN_PASSWORD environment variable
# at startup; it is never written in this file.

output {
  opensearch {
    hosts => ["https://opensearch:9200"]
    index => "sshd-%{+YYYY.MM.dd}"
    user => "admin"
    password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ssl => true
    # Certificate verification is off ONLY because OpenSearch runs its self-signed demo
    # certificate in this lab. Not acceptable anywhere else: use a CA-issued certificate
    # and set cacert instead.
    ssl_certificate_verification => false
  }
}
