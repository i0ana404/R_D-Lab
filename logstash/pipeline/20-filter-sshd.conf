# sshd authentication events -> ECS (R-03, R-05, R-06).
# Filter only: inputs and outputs live elsewhere so a test harness can feed this file.
# Input: one Ubuntu 24.04 rsyslog line per event in [message], for example
#   2026-11-09T10:00:00.000000+00:00 lab-host sshd[1234]: Failed password for invalid user admin from 203.0.113.10 port 52211 ssh2
# Any line that is not one of the supported sshd forms gets the tag _sshd_unparsed and no event.category.

filter {
  # Keep the original line. In ECS mode the line codec may already have set it.
  if ![event][original] {
    mutate { copy => { "message" => "[event][original]" } }
  }

  # rsyslog header: timestamp, host, program[pid]
  grok {
    match => {
      "message" => "^%{TIMESTAMP_ISO8601:[@metadata][timestamp]} %{SYSLOGHOST:[@metadata][hostname]} %{PROG:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:[@metadata][body]}$"
    }
    tag_on_failure => ["_sshd_unparsed"]
  }

  if "_sshd_unparsed" not in [tags] {
    date {
      match => ["[@metadata][timestamp]", "ISO8601"]
      target => "@timestamp"
    }

    # replace, not add: an input (e.g. stdin in ECS mode) may already have set host.hostname
    mutate { replace => { "[host][hostname]" => "%{[@metadata][hostname]}" } }

    if [process][name] == "sshd" {
      grok {
        match => {
          "[@metadata][body]" => [
            "^(?<[@metadata][verdict]>Failed|Accepted) (?<[system][auth][ssh][method]>password|publickey) for (?:(?<[@metadata][invalid_user]>invalid user) )?%{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int} ssh2(?:: %{GREEDYDATA:[@metadata][key]})?$",
            "^(?<[@metadata][invalid_user]>Invalid user) %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{POSINT:[source][port]:int}$"
          ]
        }
        tag_on_failure => ["_sshd_unparsed"]
      }
    } else {
      mutate { add_tag => ["_sshd_unparsed"] }
    }
  }

  if "_sshd_unparsed" not in [tags] {
    mutate {
      add_field => {
        "[event][kind]" => "event"
        "[event][category]" => "authentication"
        "[event][action]" => "ssh_login"
      }
    }

    if [@metadata][verdict] == "Accepted" {
      mutate { add_field => { "[event][outcome]" => "success" } }
    } else {
      mutate { add_field => { "[event][outcome]" => "failure" } }
    }

    if [@metadata][invalid_user] {
      mutate { add_field => { "[event][reason]" => "invalid_user" } }
    }
  }
}
