# MISP enrichment of the SSH login source address (R-08, R-10).
# Runs after 20-filter-sshd.conf. Looks up [source][ip] in /enrich/ioc_ip.yml (written by
# scripts/misp_pull.py, mounted read-only) and, on a match, tags the event and raises event.risk_score.
# No fallback: an event whose source is not in the dictionary gets no threat field at all.

filter {
  if [source][ip] {
    translate {
      source => "[source][ip]"
      target => "[threat][indicator][matched]"
      dictionary_path => "/enrich/ioc_ip.yml"
      refresh_interval => 300
    }
    if [threat][indicator][matched] {
      mutate {
        add_tag => ["threat_match"]
        add_field => { "[event][risk_score]" => "80" }
      }
      mutate { convert => { "[event][risk_score]" => "float" } }
    }
  }
}
