# Replay synthetic sshd logs into the stack (R-03).
# Reads every /data/*.log (./data on the host, mounted read-only) from the first line.
# sincedb_path /dev/null: no read position is kept, so files are re-read on every restart.

input {
  file {
    path => "/data/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    # One event per line: the file input already splits on newlines and strips them,
    # so plain is correct here (the line codec would wait for a newline that never arrives).
    codec => "plain"
  }
}
