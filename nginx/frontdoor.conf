# TLS front door for OpenSearch Dashboards (Lab 3 Part C, R-02).
# Certificate and key are issued by the lab CA (step-ca) on the deploy host and mounted read-only
# from certs/ (git-ignored) by compose.yaml.

server {
    listen 443 ssl;
    server_name localhost frontdoor.lab;

    ssl_certificate     /etc/nginx/certs/frontdoor.crt;
    ssl_certificate_key /etc/nginx/certs/frontdoor.key;

    location / {
        # Dashboards service name and container port on the internal Docker network.
        proxy_pass http://opensearch-dashboards:5601;
        proxy_set_header Host $host;
    }
}
