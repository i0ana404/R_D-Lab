# Server-side secret scanning (R-02). Runs on every pull request and every push to main.
# Supply-chain pinning: the checkout action is pinned to a full commit SHA, and the gitleaks
# binary is pinned to an exact version and verified against its published SHA-256 checksum.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify checksum
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" gitleaks
          ./gitleaks version

      - name: Scan the full git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .
