# Automated pull-request review by Claude (RISK-REGISTER R-01).
# The reviewer only comments: contents read-only, comments on the PR, no push, no merge,
# no approval. Human approval stays required. It authenticates to GitHub with this job's
# short-lived GITHUB_TOKEN instead of the Claude GitHub App, so its rights are exactly the
# permissions below. CLAUDE_CODE_OAUTH_TOKEN is a repository secret, never in the repo.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The action refuses bot actors (Dependabot PRs are left to the CI scanners), fork PRs get no secrets, and drafts wait: all three are skipped.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a security-engineering lab project.
            Follow CLAUDE.md and check the change against RISK-REGISTER.md.
            Focus on:
            - secrets, credentials, real IP addresses or threat indicators committed in clear;
            - GitHub Actions or container images not pinned by full SHA or digest;
            - shell, Python or Logstash mistakes that break deploy, detection or tests;
            - detection or enrichment changes without positive and negative tests;
            - a missing "Addresses: R-xx" risk reference in the PR description.
            Use inline comments for specific lines and one short summary comment with gh pr comment.
            In the summary comment, describe sensitive files and risky commands generically (for example "the encrypted secrets file" or "a forced push") instead of writing their paths or the commands themselves, because the repository guard hook blocks commands whose text names them.
            Do not approve, request changes, push or merge.
          # --max-turns raised from 15 to 30: a large docs PR needed 21 turns (2026-11-20).
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
