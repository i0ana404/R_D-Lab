# CI and release pipeline (Lab 4: R-01, R-11, R-12, R-13).
# Every action is pinned to a full commit SHA (verified with git ls-remote on 2026-11-09);
# the tag is kept as a trailing comment. pip tools are pinned to exact versions.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Guards R-11 and R-12: static analysis of shell scripts, the Dockerfile, the code
  # (Semgrep) and the workflows themselves (zizmor) before anything is built or released.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: nginx/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Semgrep and zizmor
        run: python -m pip install semgrep==1.184.0 zizmor==1.32.0

      - name: Semgrep
        run: semgrep scan --config p/ci --error

      - name: zizmor
        run: zizmor --offline .

  # Guards R-13 today (every image pinned by digest); detection tests join in Lab 5 (R-03).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q

  # Guards R-13: the front door image must have no HIGH or CRITICAL vulnerabilities.
  scan:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build front door image
        run: docker build -t frontdoor:ci nginx/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: frontdoor:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Guards R-13: only tested, scanned images are published, with an SBOM and a keyless signature.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the SBOM
      packages: write # push the image to GHCR
      id-token: write # OIDC token for cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute lowercase image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/frontdoor:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push front door image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" nginx/
          docker push "$IMAGE"
          digest_ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest_ref=${digest_ref}" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          image: ${{ steps.push.outputs.digest_ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          DIGEST_REF: ${{ steps.push.outputs.digest_ref }}
        run: cosign sign --yes "$DIGEST_REF"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes sbom.spdx.json
