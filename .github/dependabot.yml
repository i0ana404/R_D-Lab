# Dependabot proposes pin updates as pull requests that go through the same pipeline (R-11, R-13).
# The 7-day cooldown holds back brand-new releases: a compromised release is usually pulled within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 2026-11-18: 1.31 is the nginx mainline branch; we stay on stable 1.30.x (closed PR #18).
      - dependency-name: "nginx"
        versions: ["~> 1.31.0"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 2026-11-18: sigma-cli 4 needs pysigma >=2 but pySigma-backend-opensearch 2.0.3 (latest) needs pysigma <2 (closed PR #19).
      - dependency-name: "sigma-cli"
        update-types: ["version-update:semver-major"]
